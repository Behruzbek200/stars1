# Paid instance with persistent disk: required for real-money SQLite balances.
services:
  - type: web
    name: stars-premium-shop
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py --render-start
    healthCheckPath: /health
    disk:
      name: stars-shop-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_ID
        value: "6232278895"
      - key: ENABLE_LIVE_SALES
        value: "0"
      - key: DATA_DIR
        value: /var/data
      - key: DB_FILE
        value: /var/data/stars_shop.sqlite3
      - key: SECRET_FILE
        value: /var/data/stars_shop.secret
